spring.application.name=Host - Locacao de Quartos Compartilhados
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configuracao do Banco de Dados H2 (padrao para execucao imediata do MVP)
spring.datasource.url=jdbc:h2:file:./data/hostdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (acessivel em /h2-console para inspecao do banco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Exemplo de configuracao para PostgreSQL ou MySQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/hostdb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Internacionalizacao
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
