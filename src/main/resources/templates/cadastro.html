<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Usuário')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="form-card">
        <h1 style="font-size: 1.5rem; margin-bottom: 0.4rem;">Criar Conta de Usuário</h1>
        <p class="subtitulo" style="margin-bottom: 1.5rem;">
            Cadastre-se na plataforma Host. Após criar sua conta, você também poderá habilitar o perfil de Anunciante.
        </p>

        <div th:if="${mensagemErro}" class="alerta alerta-erro" th:text="${mensagemErro}"></div>

        <form th:action="@{/cadastro}" th:object="${cadastroDTO}" method="post" novalidate>
            <div class="form-grupo">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" th:field="*{nome}" class="form-controle"
                       placeholder="Ex.: João da Silva" required autofocus>
                <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="form-grupo">
                <label for="email">Endereço de E-mail *</label>
                <input type="email" id="email" th:field="*{email}" class="form-controle"
                       placeholder="seuemail@exemplo.com" required>
                <span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-grupo">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" th:field="*{senha}" class="form-controle"
                       placeholder="Mínimo de 6 caracteres" required>
                <span class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
            </div>

            <button type="submit" class="btn btn-primario" style="width: 100%; margin-top: 0.5rem;">
                Concluir Cadastro
            </button>
        </form>

        <p style="text-align: center; font-size: 0.92rem; margin-top: 1.25rem;">
            Já possui cadastro?
            <a th:href="@{/login}" style="color: #1e40af; font-weight: 600;">Fazer Login</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

</body>
</html>
